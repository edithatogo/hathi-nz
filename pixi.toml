[project]
name = "hathi-nz"
version = "0.1.0"
description = "New Zealand parliamentary debates volume corpus from HathiTrust, with incremental Hugging Face sync."
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tasks]
test = "pytest tests/ --cov --cov-report=term-missing"
lint = "ruff check ."
format-check = "ruff format --check ."
typecheck = "ty --error all ."
spell = "typos ."
toml-check = "taplo check pixi.toml pyproject.toml"
workflow-syntax = "actionlint .github/workflows/*.yml"
quality = { depends_on = ["lint", "format-check", "spell", "toml-check", "workflow-syntax"] }

[dependencies]
python = ">=3.11"
duckdb = ">=1.5.3"
polars = ">=1.41.2"
pyarrow = ">=21.0.0"
huggingface_hub = ">=1.18.0"
requests = ">=2.34.2"
pydantic = ">=2.0.0"
jsonschema = ">=4.26.0"

[feature.dev.dependencies]
pytest = ">=8.2.0"
pytest-cov = ">=6.0.0"
ruff = ">=0.15.16"
ty = ">=0.0.46"
typos = ">=1.47.2"
taplo = ">=0.9.3"
zizmor = ">=1.25.2"
pre-commit = ">=4.0.0"
hypothesis = ">=6.100.0"

[environments]
default = { features = [] }
dev = { features = ["dev"] }
