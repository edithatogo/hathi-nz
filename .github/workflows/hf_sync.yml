# HF Sync Pipeline — Daily HathiTrust metadata → Hugging Face Hub sync
#
# Runs the full acquisition pipeline on a schedule or manual trigger.
# Steps:
#   1. fetch_hathitrust.py — Fetch/update the volume catalog manifest
#   2. Build the rights-gated inventory publication bundle
#   3. Upload metadata and manifests to Hugging Face Hub

name: HF Sync Pipeline

on:
  schedule:
    - cron: "0 6 * * *"  # Daily at 06:00 UTC
  workflow_dispatch:      # Manual trigger from Actions tab

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: latest
          cache: true

      - name: Run tests
        run: pixi run -e dev test -- --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=75

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          use_oidc: true
          fail_ci_if_error: true

      - name: Set runner workspace paths
        shell: bash
        run: |
          set -euo pipefail
          export HATHI_ROOT="$RUNNER_TEMP/hathi-nz"
          mkdir -p "$HATHI_ROOT/inventory" "$HATHI_ROOT/publication"
          {
            echo "HATHI_ROOT=$HATHI_ROOT"
            echo "INVENTORY_PATH=$HATHI_ROOT/inventory/nz_parliamentary_debates_hansard.json"
            echo "PUBLICATION_DIR=$HATHI_ROOT/publication"
          } >> "$GITHUB_ENV"

      - name: Fetch catalog manifest in GitHub Actions
        run: |
          pixi run -e dev python scripts/fetch_hathitrust.py collection-export \
            --collection-id "${{ vars.HATHI_COLLECTION_ID || '71329709' }}" \
            --export-file "$GITHUB_WORKSPACE/data/hathi_collection_export_71329709.tsv" \
            --output "$INVENTORY_PATH"

      - name: Build metadata-only publication bundle
        run: |
          set -euo pipefail
          mkdir -p "$PUBLICATION_DIR/inventory" "$PUBLICATION_DIR/reports"
          cp "$INVENTORY_PATH" "$PUBLICATION_DIR/inventory/"
          cp manifests/hathitrust-nz/collection_manifest.json "$PUBLICATION_DIR/inventory/"
          cp manifests/hathitrust-nz/routing_manifest.json "$PUBLICATION_DIR/inventory/"
          cp reports/status/status_report.json "$PUBLICATION_DIR/reports/" 2>/dev/null || true
          cp reports/publication_evidence/publication_evidence.json "$PUBLICATION_DIR/reports/" 2>/dev/null || true
          cp reports/blockers/blocker_report.json "$PUBLICATION_DIR/reports/" 2>/dev/null || true

      - name: Validate inventory publication bundle
        run: |
          pixi run -e dev python scripts/validate_catalog.py \
            --manifest "$INVENTORY_PATH" \
            --schema manifests/schema.json \
            --report "$PUBLICATION_DIR/validation_report.json"

      - name: Upload metadata and manifests to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pixi run -e dev python scripts/upload_hf_folder.py \
            --source-dir "$PUBLICATION_DIR" \
            --repo-id edithatogo/corpus-nz-hathi \
            --path-in-repo "archive-metadata" \
            --commit-message "Auto-sync: rights-gated HathiTrust metadata update"
