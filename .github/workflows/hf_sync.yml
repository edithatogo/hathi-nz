# HF Sync Pipeline — Daily HathiTrust → Hugging Face Hub sync
#
# Runs the full acquisition pipeline on a schedule or manual trigger.
# Steps:
#   1. fetch_hathitrust.py — Fetch/update the volume catalog manifest
#   2. stage_hf_dataset.py  — Download and stage volume content
#   3. validate_catalog.py  — Validate staged data (quality gate)
#   4. upload_hf_dataset.py — Upload to Hugging Face Hub

name: HF Sync Pipeline

on:
  schedule:
    - cron: "0 6 * * *"  # Daily at 06:00 UTC
  workflow_dispatch:      # Manual trigger from Actions tab

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: latest
          cache: true

      - name: Run tests
        run: pixi run -e dev test -- --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=75

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          use_oidc: true
          fail_ci_if_error: true

      - name: Set runner workspace paths
        shell: bash
        run: |
          set -euo pipefail
          export HATHI_ROOT="$RUNNER_TEMP/hathi-nz"
          mkdir -p "$HATHI_ROOT/manifests" "$HATHI_ROOT/raw" "$HATHI_ROOT/processed" "$HATHI_ROOT/state"
          {
            echo "HATHI_ROOT=$HATHI_ROOT"
            echo "MANIFEST_PATH=$HATHI_ROOT/manifests/latest_manifest.json"
            echo "DOWNLOAD_DIR=$HATHI_ROOT/raw"
            echo "STAGE_DIR=$HATHI_ROOT/processed"
            echo "STATE_DIR=$HATHI_ROOT/state"
          } >> "$GITHUB_ENV"

      - name: Fetch catalog manifest in GitHub Actions
        env:
          HATHI_COLLECTION_ID: ${{ vars.HATHI_COLLECTION_ID || '71329709' }}
        run: |
          pixi run -e dev python scripts/fetch_hathitrust.py collection-export \
            --collection-id "$HATHI_COLLECTION_ID" \
            --output "$MANIFEST_PATH" \
            --enrich-api

      - name: Stage datasets
        run: |
          pixi run -e dev python scripts/stage_hf_dataset.py \
            --manifest "$MANIFEST_PATH" \
            --download-dir "$DOWNLOAD_DIR" \
            --stage-dir "$STAGE_DIR" \
            --state-dir "$STATE_DIR"

      - name: Validate catalog and staged data
        run: |
          pixi run -e dev python scripts/validate_catalog.py \
            --manifest "$MANIFEST_PATH" \
            --stage-dir "$STAGE_DIR" \
            --schema manifests/schema.json \
            --report "$STATE_DIR/validation_report.json" \
            --fail-on-warning

      - name: Upload to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pixi run -e dev python scripts/upload_hf_dataset.py \
            --stage-dir "$STAGE_DIR" \
            --repo-id edithatogo/corpus-nz-hathi \
            --state-dir "$STATE_DIR" \
            --commit-message "Auto-sync: corpus-nz-hathi update"
