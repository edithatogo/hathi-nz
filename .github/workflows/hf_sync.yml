# HF Sync Pipeline — Daily HathiTrust → Hugging Face Hub sync
#
# Runs the full acquisition pipeline on a schedule or manual trigger.
# Steps:
#   1. fetch_hathitrust.py — Fetch/update the volume catalog manifest
#   2. stage_hf_dataset.py  — Download and stage volume content
#   3. validate_catalog.py  — Validate staged data (quality gate)
#   4. upload_hf_dataset.py — Upload to Hugging Face Hub

name: HF Sync Pipeline

on:
  schedule:
    - cron: "0 6 * * *"  # Daily at 06:00 UTC
  workflow_dispatch:      # Manual trigger from Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: latest
          cache: true

      - name: Run tests
        run: pixi run -e dev test -- --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=75

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: true

      - name: Prepare catalog manifest
        run: |
          mkdir -p manifests
          if [ ! -f manifests/latest_manifest.json ]; then
            python -c "import json, pathlib; pathlib.Path('manifests/latest_manifest.json').write_text(json.dumps({'meta': {'generated_at': None, 'source': 'HathiTrust Collection ID 71329709', 'version': '0.1.0', 'record_count': 0, 'schema': 'manifests/schema.json'}, 'volumes': []}, indent=2), encoding='utf-8')"
          fi

      - name: Stage datasets
        run: |
          pixi run python scripts/stage_hf_dataset.py \
            --manifest manifests/latest_manifest.json \
            --download-dir data/raw \
            --stage-dir data/processed \
            --state-dir data/_state

      - name: Validate catalog and staged data
        run: |
          pixi run python scripts/validate_catalog.py \
            --manifest manifests/latest_manifest.json \
            --stage-dir data/processed \
            --schema manifests/schema.json \
            --report data/_state/validation_report.json \
            --fail-on-warning

      - name: Upload to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pixi run python scripts/upload_hf_dataset.py \
            --stage-dir data/processed \
            --repo-id edithatogo/corpus-nz-hathi \
            --state-dir data/_state \
            --commit-message "Auto-sync: corpus-nz-hathi update"
