name: Publication Status

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      workflow_run_id:
        description: Optional workflow run ID containing a published status artifact.
        required: false
        type: string
      artifact_name:
        description: Artifact name to download from the referenced run.
        required: false
        default: hathitrust-nz-collection-publication
        type: string

permissions:
  contents: read
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download published status artifact
        if: ${{ inputs.workflow_run_id != '' }}
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.workflow_run_id }}
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/publication-status-artifact

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: latest
          cache: true
          environments: dev

      - name: Summarize blockers
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.workflow_run_id }}" ]; then
            export BLOCKER_REPORT_PATH="$RUNNER_TEMP/publication-status-artifact/blockers/blocker_report.json"
          else
            export BLOCKER_REPORT_PATH="reports/blockers/blocker_report.json"
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          blocker_report = Path(os.environ["BLOCKER_REPORT_PATH"])

          print("## Publication blockers")
          print("")
          if not blocker_report.exists():
              print("Blocker report not available.")
              raise SystemExit(0)

          data = json.loads(blocker_report.read_text(encoding="utf-8"))
          meta = data.get("meta", {}) if isinstance(data, dict) else {}
          print(f"- Track count: `{meta.get('track_count', 0)}`")
          print(f"- Blocker count: `{meta.get('blocker_count', 0)}`")
          print(f"- Required access groups: `{meta.get('group_count', 0)}`")
          print("")
          for category_id, group in (data.get("blocker_groups", {}) or {}).items():
              print(f"### {group.get('title', category_id)} (`{category_id}`)")
              summary = group.get("summary")
              if summary:
                  print(summary)
              required_access = group.get("required_access", [])
              if required_access:
                  print("")
                  print("Required access:")
                  for access in required_access:
                      print(f"- `{access}`")
              print("")
              for item in group.get("items", []):
                  print(f"- `{item.get('track_id', '')}`: `{item.get('blocker', '')}`")
          PY

      - name: Report publication status
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--strict)
          if [ -n "${{ inputs.workflow_run_id }}" ]; then
            ARGS+=(--status-report "$RUNNER_TEMP/publication-status-artifact/reports/status/status_report.json")
            ARGS+=(--publication-evidence "$RUNNER_TEMP/publication-status-artifact/publication_evidence/publication_evidence.json")
            ARGS+=(--blocker-report "$RUNNER_TEMP/publication-status-artifact/blockers/blocker_report.json")
          fi
          pixi run -e dev publication-status "${ARGS[@]}"
