name: CI Learning Candidates

on:
  workflow_run:
    workflows:
      - "Docs Lint"
      - "Release to Hugging Face"
      - "Release to Zenodo"
    types:
      - completed

permissions:
  contents: read

jobs:
  capture:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'action_required' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record CI failure candidate
        env:
          LEARNING_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          LEARNING_WORKFLOW_ID: ${{ github.event.workflow_run.id }}
          LEARNING_WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
          LEARNING_WORKFLOW_ACTOR: ${{ github.event.workflow_run.actor.login }}
          LEARNING_WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 scripts/record_learning_candidate.py \
            --backlog conductor/improvement-backlog.md \
            --snapshot "conductor/.tmp/ci-learning-candidates-${LEARNING_WORKFLOW_ID}.md" \
            --message "CI failure summary candidate for ${LEARNING_WORKFLOW_NAME}" \
            --evidence "workflow=${LEARNING_WORKFLOW_NAME}" \
            --evidence "run_id=${LEARNING_WORKFLOW_ID}" \
            --evidence "run_url=${LEARNING_WORKFLOW_URL}" \
            --evidence "actor=${LEARNING_WORKFLOW_ACTOR}" \
            --evidence "head_sha=${LEARNING_WORKFLOW_HEAD_SHA}"

      - name: Upload non-committing learning candidate artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-learning-candidates-${{ github.event.workflow_run.id }}
          path: conductor/.tmp/ci-learning-candidates-${{ github.event.workflow_run.id }}.md
