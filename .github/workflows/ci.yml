# CI workflow for hathi-nz
#
# Runs lint, type-check, and tests on every push / PR.
# The full pipeline (ingest → stage → upload) lives in hf_sync.yml.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: latest
          cache: true
      - name: Lint
        run: pixi run lint
      - name: Format check
        run: pixi run format-check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: latest
          cache: true
      - name: Type check
        run: pixi run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: latest
          cache: true
      - name: Run tests
        run: pixi run test -- --cov --cov-report=term-missing
