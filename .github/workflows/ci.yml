# CI workflow for hathi-nz
#
# Runs lint, type-check, and tests on every push / PR.
# The full pipeline (ingest → stage → upload) lives in hf_sync.yml.

name: CI

# mutmut mutation testing runs in the advisory .github/workflows/mutation.yml workflow;
# this required workflow keeps the deterministic quality gates fast and stable.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: latest
          cache: false
          environments: dev
      - name: Lint
        run: pixi run -e dev lint-strict
      - name: Format check
        run: pixi run -e dev format-check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: latest
          cache: false
          environments: dev
      - name: Strict Pyright type check
        run: pixi run -e dev pyright-check

      - name: Validate archive registry
        run: pixi run -e dev python scripts/validate_archive_registry.py

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: latest
          cache: false
          environments: dev
      - name: Run tests
        run: pixi run -e dev test -- --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          use_oidc: true
          fail_ci_if_error: true
