# CI workflow for hathi-nz
#
# Runs lint, type-check, and tests on every push / PR.
# The full pipeline (ingest → stage → upload) lives in hf_sync.yml.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: latest
          cache: false
          environments: dev
      - name: Lint
        run: pixi run -e dev lint
      - name: Format check
        run: pixi run -e dev format-check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: latest
          cache: false
          environments: dev
      - name: Type check
        run: pixi run -e dev typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: latest
          cache: false
          environments: dev
      - name: Run tests
        run: pixi run -e dev test -- --cov --cov-report=term-missing --cov-fail-under=75

  mutmut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: latest
          cache: false
          environments: dev
      - name: Run mutmut
        run: pixi run -e dev mutmut run --paths-to-mutate scripts/ --tests-dir tests/ --ci
