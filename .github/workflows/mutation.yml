name: Mutation Testing

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 6"

permissions:
  contents: read

jobs:
  mutmut:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: latest
          cache: false
          environments: dev
      - name: Run mutation testing
        run: pixi run -e dev mutmut run
      - name: Summarize mutation testing
        if: always()
        run: echo "Mutation testing is advisory until a repository mutation score threshold is configured." >> "$GITHUB_STEP_SUMMARY"
